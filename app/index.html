<title>がくふよみ</title>
<meta name="description" content="楽譜がスラスラ読めるようになるピアノ練習ゲーム。ドレミから両手の大譜表まで段階的に。相対音感トレーニングつき">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Music&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 横持ちのピアノ教室。上に五線、下に鍵盤。紙の楽譜っぽいクリーム地 */
:root {
  --bg: #fbf7ef; --card: #ffffff; --ink: #24212b; --sub: #6b6675; --line: #e6dfd2;
  --accent: #2f6fd0; --accent-soft: #e6eefb; --ok: #2e8a5c; --ok-soft: #e3f4ea; --ng: #d0443a; --ng-soft: #fbe6e3; --gold: #e0a020;
  --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --r: 14px; color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; }
p { margin: 0; }
.muted { color: var(--sub); } .small { font-size: 13px; }
#app { min-height: 100%; }

/* ホーム */
.home { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; display: grid; gap: 14px; }
.mast { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mast h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; }
.mast h1 span { color: var(--accent); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 16px; font-weight: 700; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.lv { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; min-height: 78px; }
.lv b { font-family: var(--display); font-size: 15px; }
.lv .no { font-size: 12px; color: var(--sub); }
.lv .st { color: var(--gold); letter-spacing: 2px; font-size: 14px; }
.lv[disabled] { opacity: .45; cursor: default; }
.lv.lesson { background: #fffaf0; border-style: dashed; }
.lv.done { border-color: #c9dcc9; }
.goal { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.bar { height: 8px; background: #ece5d8; border-radius: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }

/* プレイ画面(横持ち前提: 上=五線、下=鍵盤) */
.play { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
.top { display: flex; align-items: center; gap: 10px; padding: 6px 10px; }
.top .t { font-family: var(--display); font-weight: 800; flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.pill.icon { padding: 4px 10px; }
.stage { display: grid; place-items: center; padding: 0 8px; min-height: 0; position: relative; }
.score { width: 100%; height: 100%; max-height: 100%; }
.msg { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-family: var(--display); font-weight: 800; font-size: 18px; pointer-events: none; }
.msg.ok { color: var(--ok); } .msg.ng { color: var(--ng); }
.answers { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 6px; }
.ans { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 18px; font-size: 18px; font-weight: 700; min-width: 96px; }
.ans.ok { border-color: var(--ok); background: var(--ok-soft); } .ans.ng { border-color: var(--ng); background: var(--ng-soft); }

/* 鍵盤 */
.kbwrap { padding: 0 6px 6px; display: grid; gap: 4px; }
.kbtools { display: flex; gap: 8px; justify-content: center; }
.rest { border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 4px 18px; font-weight: 800; font-family: var(--display); }
.kb { position: relative; height: clamp(110px, 34dvh, 220px); display: flex; touch-action: none; user-select: none; -webkit-user-select: none; }
.wk { flex: 1; border: 1px solid #b9b2a5; border-top: 0; background: linear-gradient(#fff, #f6f3ee); border-radius: 0 0 8px 8px; margin: 0 1px; position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: clamp(10px, 2.2vw, 14px); font-weight: 700; color: var(--sub); }
.bk { position: absolute; top: 0; height: 60%; background: linear-gradient(#3a3640, #16141a); border-radius: 0 0 6px 6px; z-index: 2; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 10px; color: #cfc9d6; }
.wk.on, .bk.on { background: var(--accent-soft); } .bk.on { background: #5b7fc0; }
.wk.ok { background: var(--ok-soft); } .bk.ok { background: var(--ok); }
.wk.ng { background: var(--ng-soft); } .bk.ng { background: var(--ng); }
.wk.tonic { box-shadow: inset 0 -6px 0 var(--gold); }
.bk.tonic { box-shadow: inset 0 -6px 0 var(--gold); color: var(--gold); }
.wk .lab.do, .bk .lab.do { color: var(--gold); }

/* 結果・レッスン */
.sheet { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.card svg { width: 100%; height: auto; max-height: 220px; }
.primary { border: 0; border-radius: var(--r); background: var(--accent); color: #fff; font-weight: 800; padding: 12px 18px; font-size: 16px; }
.ghost { border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 11px 16px; font-weight: 700; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.big { font-family: var(--display); font-size: 42px; font-weight: 800; }
.stars { color: var(--gold); font-size: 30px; letter-spacing: 4px; }
.tip { background: #fffaf0; border-left: 4px solid var(--gold); padding: 8px 12px; border-radius: 6px; }
.portrait-hint { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  .play .portrait-hint { display: block; position: fixed; bottom: 8px; left: 8px; right: 8px; background: #24212b; color: #fff; text-align: center; padding: 8px; border-radius: 10px; font-size: 13px; z-index: 10; }
}
</style>
<div id="app"></div>
<script src="furi.js"></script>
<script src="app.js"></script>
